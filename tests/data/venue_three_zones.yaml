# 행사장 도면 (시연용 설정)
#
# 실제 장소의 도면이 아니다. 팀이 시연을 위해 정한 약도다 (D-27, D-38, D-44, D-45).
#  - 영상: AI Hub "지능형 관제 서비스 CCTV 영상 데이터"의 인파밀집 영상 (2024년 핼러윈 주간, 국내 상가 골목).
#  - 세 거리를 구역 A, B, C로 놓았고, 세 구역이 한 길로 이어져 있다고 가정했다 (D-45, D-46). 실제로 이어진 길인지는 모른다.
#  - 구역마다 같은 거리의 영상 세 개를 차례로 잇는다. 서로 다른 날·시각의 영상이다 (D-45).
#  - 도면은 축척이 없는 약도다. 구역의 실제 넓이는 모른다 (area_m2: null).
# 화면과 보고서에 "가상의 약도에 공개 영상을 CCTV로 가정해 놓았다"고 밝힌다 (규칙 5, E-06).
#
# 영상에서 나오는 것: 사람 점의 위치(세는 바닥 안에서의 자리)와 수.
# 팀이 정한 것: 구역의 이름과 자리, 영상의 차례, 세는 바닥의 네 점.
name: 가상 행사장
# 약도의 모양은 사용자가 그려 준 그림을 따랐다 (D-46): 세로로 난 길과, 그 아래쪽 끝에서 왼쪽으로 꺾이는 길(ㄴ자).
# 구역 A, B, C는 세로 길을 따라 위에서부터 차례로 떨어져 놓이고, 길로 이어진다. C는 길이 꺾이는 모퉁이에 있다.
# 구역 사이의 길은 CCTV가 보지 않는 곳이다 (관측 불가, 01의 11번).
plan_size: [11.5, 18.8]       # 그림 전체 (약도 단위, 축척 없음)
roads:                        # 길 [왼쪽, 위, 가로, 세로]
  - [5.2, 0.0, 6.3, 18.8]     # 세로 길
  - [0.0, 15.9, 11.5, 2.9]    # 아래쪽에서 왼쪽으로 꺾이는 길
clip_seconds: 60              # 영상 하나에서 쓰는 길이 (영상은 58~62초, E-47)
video_dir: data/aihub71850_crowd/video
detections_dir: outputs/detections/aihub

# 구역마다:
#   plan_rect — 구역 네모가 약도에서 놓이는 자리 [왼쪽, 위, 가로, 세로]. 세 구역은 떨어져 있고 길로 이어진다 (D-46).
#   cctv.floor_quad_px — 화면(1920x1080)에서 사람을 세는 바닥의 네 점. 차례는 먼 쪽 왼쪽, 먼 쪽 오른쪽,
#     가까운 쪽 오른쪽, 가까운 쪽 왼쪽. 골목 바닥을 눈으로 따라 잡았다 (E-47). 발(상자의 아래쪽 가운데)이
#     이 안에 있는 사람만 센다 (E-37). 이 네 점이 구역 네모의 네 귀퉁이로 옮겨진다 (먼 쪽이 위).
#   cctv.clips — 차례로 잇는 영상 (D-45).
zones:
  A:
    name: A구역
    street: 계단 골목
    plan_rect: [6.5, 1.0, 3.6, 5.5]
    area_m2: null
    cctv:
      id: CCTV-A
      image_size: [1920, 1080]
      floor_quad_px: [[744, 204], [1212, 204], [1548, 1056], [396, 1056]]
      clips: [E05_023, E05_002, E05_025]
  B:
    name: B구역 (메인)          # D-42: 사람이 가장 많은 구역을 메인으로 가정
    street: 벽화 골목
    plan_rect: [6.5, 7.2, 3.6, 5.5]
    area_m2: null
    cctv:
      id: CCTV-B
      image_size: [1920, 1080]
      floor_quad_px: [[800, 312], [1188, 312], [1128, 1056], [20, 1056]]
      clips: [E05_022, E05_026, E05_024]
  C:
    name: C구역
    street: 노란 건물 모퉁이
    plan_rect: [6.5, 13.2, 3.6, 5.5]
    area_m2: null
    cctv:
      id: CCTV-C
      image_size: [1920, 1080]
      floor_quad_px: [[1020, 192], [1218, 192], [1548, 1056], [720, 1056]]
      clips: [E05_004, E05_008, E05_012]
