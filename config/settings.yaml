# CrowdFlow Agent 설정 파일
# 숫자와 설정은 이 파일 한 곳에 모읍니다 (팀 작업 규칙 규칙 3).
# 값마다 근거 번호(E-번호)나 결정 번호(D-번호)를 답니다.

# 행사장 약도와 구역별 CCTV (D-44, D-45)
venue: config/venue/halloween_alleys.yaml

detection:
  # 사람 전체를 찾는 미리 학습된 모델 (D-26, D-44). 통과 시험과 새 자료 비교에서 가장 잘 맞은 것 (E-27, E-47).
  model: yolo26x.pt
  # 입력 크기. 1080p 골목 영상에서 640보다 1280이 사람을 더 찾음 (E-47: 예를 들어 E05_003에서 14명 → 27.6명).
  imgsz: 1280
  # 영상(초당 30장)에서 몇 장마다 한 장을 보는지. 3이면 초당 10장 (D-45).
  video_step: 3
  # COCO 자료에서 "사람"의 번호 (E-36, Ultralytics 공식 문서)
  person_class_id: 0
  # 아래 두 값은 Ultralytics 공식 문서의 기본값을 그대로 씀 (E-45). 우리가 고른 값이 아님.
  conf: 0.25
  iou: 0.7

vision_live:
  # 화면 시연에서 쓰는 실시간 분석 (D-55). 영상을 시각에 맞춰 읽으면서 GPU로 사람을 찾고, 상자를 그린 영상을 화면에 흘려보낸다.
  # 꺼 두거나 일꾼이 뜨지 않으면, 미리 분석해 둔 결과(outputs/detections)를 읽는다. 모델과 설정은 위의 detection과 같다.
  enabled: true
  port: 8502            # 실시간 분석 일꾼이 쓰는 포트 (화면 서버는 8501)
  device: 1             # 사람 찾기에 쓰는 GPU 번호. 글을 읽는 AI(Ollama)와 겹치지 않게 둘째 GPU를 쓴다
  half: true            # 반정밀도(FP16)로 돌릴지. 속도와 센 값의 차이를 잰 결과로 정한다 (E-57)
  stream_width: 960     # 화면에 보내는 영상의 가로 크기(픽셀). 보기 위한 크기이고 분석은 원래 크기로 한다

crowd_levels:
  # 붐빔 단계 (D-45). 구역의 "세는 바닥" 안에서 찾은 사람 수의 평균이 min 이상이면 그 단계다.
  # 이 영상에 맞춰 정한 시연용 기준이다. 지금 쓰는 값은 아래 levels의 24/28/32명이다 (D-58, 임시 값, Q-43).
  # 값이 바뀌어 온 차례:
  #   처음(D-45, 사용자가 고름, 측정값은 E-47): 25/30/35명
  #     25명 — B구역의 붐비는 영상에서는 줄곧 넘고(5초 평균 26~34명), 다른 영상에서는 한 번도 넘지 않는 값
  #     30명 — B구역의 붐비는 영상에서 20초쯤 넘는 값 / 35명 — 한 번도 넘지 않는 값
  # 주의: 넓이를 모르는 영상이라 1㎡당 사람 수가 아니라 사람 수로 나눴다. 사고 위험 기준인 서울시 기준
  # (1㎡당 3·4·5명, E-11)이나 보행 밀도 기준(Fruin, E-46)과 다르다. 화면과 보고서에 그렇게 밝힌다.
  metric: count
  smoothing_seconds: 5      # 지난 몇 초의 평균으로 판단하는지 (D-45, 흔들림 측정은 E-28)
  below_name: 평상          # 가장 낮은 단계의 이름. 임시 이름 (사용자 확인 필요)
  #   그다음(D-57, 2026-10-04 밤): 사용자가 "기준을 조금 낮춰서 다른 구역에서도 사건이 나게" 하자고 해서 20/25/30명으로 낮춤 (E-62). 지금은 쓰지 않음.
  levels:
    # 지금 값 (D-58, 2026-10-04 밤): 네 번째 구역(D)의 사람 수를 기준으로 삼음. 24명이면 D구역이 처음 100초쯤 거의 줄곧 넘고,
    #   그 뒤 15초쯤 아래로 내려간다 (E-63). B구역은 64~122초에 넘고 심각까지 오른다. C구역은 24.2명까지라 잠깐만 넘는다. A구역은 넘지 않는다.
    #   값은 AI 코딩 도구가 측정값을 보고 고른 임시 값이다 (사용자 확인 필요, Q-43).
    - {name: 주의, min: 24}
    - {name: 경계, min: 28}
    - {name: 심각, min: 32}
  # 이 단계부터 요원을 보낸다 (D-41). 서울시 훈련은 "경계"에서 보냈지만(E-11) 우리는 한 단계 앞에서 보낸다.
  dispatch_from: 주의
  # 참고로만 적어 두는 다른 기준 (판단에는 쓰지 않음)
  reference:
    seoul_people_per_m2: [3, 4, 5]             # E-11
    fruin_people_per_m2: [0.72, 1.08, 2.15]    # E-46 (QUT 자료로 시험할 때 썼던 기준, D-37)

staffing:
  # 요원 배치 계산의 설정 (D-47). 공식 기준이 없어서(E-18) 모두 사용자가 정한 시연 설정이다.
  roster: config/staff.csv            # 모의 요원 자료 (시연을 위해 만든 것. 실제 사람의 정보가 아님)
  standby_zone: 대기                  # 예비 요원이 기다리는 곳
  break_length_minutes: 10            # 휴게 길이: 1시간마다 10분 (D-09, E-17)
  soon_break_minutes: 10              # 휴게까지 이 시간 안이면 "곧 휴게"로 보고 보내지 않음 (D-47, Q-06)
  # 단계별로 그 구역에 더 필요한 요원 수: 한 단계 오를 때마다 1명 (D-47, Q-05)
  extra_staff_per_level: {주의: 1, 경계: 2, 심각: 3}
  # 구역마다 남겨야 할 최소 인원 (D-47, Q-08). 관리자의 글 지시로 바뀐다 (D-05).
  min_staff_per_zone: {A: 1, B: 1, C: 1, D: 1}
  # 구역 사이 이동 시간(분) (D-47, Q-07). 잰 값이 아니라 약도(D-46)의 차례에 맞춘 설정: 옆 구역 1분, 한 구역 건너 2분.
  # 예비 요원이 기다리는 곳에서의 이동 시간은 정하지 않았다 (적지 않으면 "정해지지 않음"으로 나온다).
  # 2026-10-04 밤에 줄임 (D-58): 시연이 3분이라 이동이 금방 끝나게 함. 단위는 초. 옆 구역 10초, 한 구역 건너 20초, 두 구역 건너 30초.
  travel_seconds: {A-B: 10, B-C: 10, C-D: 10, A-C: 20, B-D: 20, A-D: 30, 대기-A: 20, 대기-B: 10, 대기-C: 10, 대기-D: 20}
  # ↑ 예비 요원이 기다리는 곳에서의 시간(대기-A, 대기-B, 대기-C)은 AI 코딩 도구가 임시로 정한 값이다
  #   (예비 요원이 메인인 B구역 가까이에서 기다린다고 가정). 사용자 확인 필요 (D-49).

llm:
  # 글을 읽고 판단하는 AI (D-48). 이 컴퓨터의 Ollama에서 돌린다. 키가 필요 없고 글이 밖으로 나가지 않는다.
  model: ollama_chat/crowdflow-qwen:27b   # CrewAI의 "제공자/모델 이름" (E-35). 아래 바탕 모델에 num_ctx만 바꾼 이름이고, 없으면 스스로 만든다
  base_model: qwen3.8:27b             # 바탕 모델 (D-48). 쓰는 조건은 Apache 2.0 (E-51)
  base_url: http://127.0.0.1:11434    # Ollama의 주소. localhost라고 쓰면 Windows에서 연결할 때마다 2초쯤 더 걸렸다 (E-63)
  temperature: 0                      # 같은 글에 같은 답이 나오게 한다
  reasoning_effort: none              # 긴 추론을 끈다. 켜면 더 느리고 정확도도 오르지 않았다 (E-51)
  timeout_seconds: 120
  # 한 번에 읽는 글의 길이 한도(토큰). 기본(32768)에서는 모델이 27GB로 올라가 GPU 두 장에 나뉘었고, 8192에서는 22GB로 한 장에 올라갔다 (E-59).
  # 한 장에 올리면 답 쓰는 속도가 조금 빨라지고(초당 30~39 → 42~49토큰), 다른 한 장을 사람 찾기(vision_live)에 온전히 쓸 수 있다.
  num_ctx: 8192
  # 모델을 미리 올려 두고 내려가지 않게 한다 (E-54). Ollama는 5분 동안 쓰지 않은 모델을 내리고(공식 문서),
  # 다시 올리는 데 69초가 걸려 그동안 흐름이 멈췄다(잰 값). 화면 서버(live.py)만 쓴다.
  keep_alive: 30m                     # 한 번 깨울 때 이만큼 올려 둔다 (Ollama의 keep_alive)
  warm_every_seconds: 120             # 화면 서버가 켜져 있는 동안 이 간격으로 다시 깨운다 (5분보다 짧게)
  # 토론의 효율·안전 의견만 가벼운 모델로 내기 (D-65, 사용자 제안 2026-10-05. 재 본 결과는 E-73).
  #   글 읽기(소통 담당), 지침 가리기, 결정(계획 담당), 결과 판단과 하루 정리(확인 담당)는 위의 큰 모델이 그대로 한다.
  #   가벼운 모델은 관리자의 최소 인원 지시를 읽지 못했기 때문이다(E-72). 의견 내기는 선택지 번호 하나와 이유 한두 문장이라 가벼운 모델에 맡긴다.
  opinion:
    enabled: false                 # true면 효율 담당과 안전 담당이 아래 모델을 쓴다. false면 모든 담당이 위의 모델 하나를 쓴다. 꺼 두기로 정함 (D-66)
    model: ollama_chat/crowdflow-qwen3:8b   # 아래 바탕 모델에 num_ctx만 정해 둔 이름이고, 없으면 스스로 만든다 (위의 큰 모델과 같은 방식)
    base_model: qwen3:8b              # 이 컴퓨터에 있던 것. 쓰는 조건은 Apache 2.0 (`ollama show qwen3:8b`로 확인, E-73)
    num_ctx: 8192                     # 정해 두지 않으면 40960으로 올라가 GPU 메모리를 13.7GB 썼다 (E-72)
    # 두 의견을 동시에 부를지 (CrewAI의 Task async_execution). Ollama가 OLLAMA_NUM_PARALLEL=2 이상으로 떠 있어야 실제로 겹쳐 돈다.
    # 그렇지 않으면 Ollama가 줄을 세워 하나씩 처리한다(느려질 뿐 틀리지는 않는다). 큰 모델은 계열 때문에 병렬이 묶여 있다 (E-72).
    together: true

operation:
  # 처리 흐름의 설정 (D-49, D-50). AI 코딩 도구가 임시로 정한 값은 그렇게 적었다.
  approval_mode: auto                 # auto: 관리자 승인 없이 바로 지시를 보냄 / manual: 관리자가 승인해야 보냄 (D-50)
  recheck_after_seconds: 15           # 도착 뒤 이만큼 지나서 다시 센다 (임시 값, Q-25. 2026-10-04 밤에 20 → 15)
  max_rechecks: 3                     # 이만큼 다시 확인해도 안 풀리면 관리자에게 알린다. 알린 뒤에도 계속 지켜본다 (D-58)
  more_after_rechecks: 2              # 이만큼 다시 확인할 때마다, 그대로 붐비면 요원을 1명 더 보낼 수 있다 (D-58, 임시 값)
  reopen_wait_seconds: 30             # 사건을 닫은 구역은 이만큼 지켜본 뒤에 새 사건을 연다 (금방 오르내릴 때 열고 닫기를 되풀이하지 않게. D-58, 임시 값)
  max_extra_staff: 3                  # 한 구역에 붐빔 대응으로 보내는 요원의 최대 수 (D-58, 임시 값. 단계별 표의 최댓값과 같게 둠)

scenario:
  # 시연의 시계: 영상의 0초가 이 시각이라고 본다. 영상이 밤에 찍힌 것에 맞춘 모의 설정이다 (D-47).
  start_clock: "20:00"
  # 요원 역할을 대본이 대신하기 (D-60). 관리자 화면의 스위치로 켜고 끈다. 켜 있는 동안 화면에 "요원 역할: 대본"이 보인다.
  #   혼자 시연하거나 연습할 때 쓴다. 사람이 요원 화면에서 하던 일(답하기, 도착 누르기)을 정해 둔 대로 넣는 것이고, AI가 하는 일이 아니다.
  staff_script:
    enabled: false                    # 켜 둔 채로 시작할지. 기본은 끔 (사람이 요원 화면에서 직접 한다)
    first_reply_after_seconds: 5      # 붐빔 대응 지시를 처음 받은 요원이 이만큼 뒤에 아래 글로 답한다 (대본 실행 run_e2e.py의 대본과 같은 값)
    first_reply: "다친 관람객을 돌보는 중이라 못 갑니다"   # 꼭 넣는 장면 1의 글 (D-05). 아래에 정한 수의 요원이 이렇게 답한다
    refusals: 1                       # 붐빔 대응 지시를 받은 요원 가운데 처음 몇 명이 위의 글로 답하는지. 평소 대본은 1명 (D-60)
    # "어려운 날" 대본 (D-64, 사용자 지시 2026-10-05: 다친 사람이 많아 예비 요원이 아쉬운 상황을 만들 것). 화면("하루 정리")에서 켜고 끈다.
    #   프로그램을 일부러 못하게 만드는 것이 아니라, 현장 사정(요원의 답)만 어렵게 한 대본이다. 켜 있는 동안 화면과 기록에 표시된다.
    hard_refusals: 3                  # 어려운 날에는 처음 3명이 위의 글로 답한다. AI 코딩 도구가 고른 임시 값 (사용자 확인 필요, Q-48)
    # 그 밖의 요원은 지시를 받은 뒤 이동 시간(staffing.travel_seconds)이 지나면 "도착"을 누른다

guideline:
  # 운영 지침을 토론에 읽히기 (D-64). 지침 담당이 지금 상황에 맞는 조항을 읽어 주고, 계획 담당이 그것까지 보고 정한다.
  enabled: false                                # 켜 둔 채로 시작할지. 기본은 끔. 화면("하루 정리")에서 켜고 끈다
  base: knowledge/operations_guideline.md       # 팀이 준비한 기본 지침. 이미 정한 규칙을 옮겨 적은 시연용 모의 자료
  learned: outputs/knowledge/learned.jsonl      # 하루 정리에서 관리자가 승인해 더한 문장. 실행하면서 쌓인다 (저장소에 올리지 않음)
  embed_model: bge-m3                           # 글을 숫자로 바꾸는 모델. Ollama 공식 목록, MIT (E-68, E-71). 이 컴퓨터에서 돈다
  top_k: 3                                      # 한 번에 읽는 조항 수. 조항이 이보다 많으면 가장 가까운 것만 찾아 읽는다. CrewAI Knowledge의 기본값 3을 따름 (E-68)
  timeout_seconds: 30                           # 숫자로 바꾸는 요청을 기다리는 시간. 넘기면 지침 없이 토론한다 (임시 값)

ui:
  # 관리자 화면과 요원 화면의 설정 (D-55). 보기 위한 값이고 계산에는 쓰지 않는다.
  refresh_seconds: 1                                            # 결정 목록과 요원 현황을 새로 그리는 간격(초)
  map_refresh_seconds: 0.3                                      # 약도의 사람 점과 구역별 사람 수를 새로 그리는 간격(초). 영상은 일꾼이 따로 흘려보낸다
  level_colors: ["#34D399", "#FBBF24", "#FB923C", "#F87171"]    # 붐빔 단계의 색. 순서는 평상, 주의, 경계, 심각
  focus_zone: B                                                 # CCTV를 크게 보여 줄 구역 (메인 구역, D-45). 사건이 나면 그 구역으로 바뀐다
  # "하루 정리 · 운영 지침" 화면(주소 끝에 /review)과 관리자 화면의 "하루 정리" 단추를 보여 줄지 (D-68, 사용자 결정 2026-10-05).
  #   false면 단추와 화면이 없다. 코드는 그대로 남아 있고, 아래 guideline.enabled도 꺼져 있어 지침 읽기는 돌지 않는다.
  #   감춘 까닭: 지침을 읽히면 결정이 조항을 따라 바뀌는 것까지만 확인했고, 운영이 나아지는 것은 확인하지 못했다 (E-71).
  #   true로 바꾸면 아래의 결과 보고서 대신 이 화면 전체가 나온다.
  review_screen: false
  # 영상이 끝난 뒤 "결과 보고서"를 쓰는 화면(주소 끝에 /report)과 관리자 화면의 "결과 보고서" 단추를 보여 줄지 (D-75, 사용자 지시 2026-10-05).
  #   숫자와 표는 코드가 실행 기록에서 세고, "확인 담당의 정리"만 AI가 그 숫자를 보고 쓴다. 운영 지침(RAG)에 넣을 제안은 싣지 않는다.
  result_report: true

plan_view:
  # (예전 그림 방식, 보고서용 그림에만 씀) 약도 그림의 크기 (약도 단위 하나를 몇 픽셀로 그릴지). 보기 좋게 정한 화면 설정이고 계산에는 쓰지 않음.
  pixels_per_unit: 40
  # 한글 글꼴 (Windows의 맑은 고딕). 없는 컴퓨터에서는 기본 글꼴로 그린다.
  font: C:/Windows/Fonts/malgun.ttf
  font_bold: C:/Windows/Fonts/malgunbd.ttf
  # 붐빔 단계의 색 [빨강, 초록, 파랑]. 순서는 평상, 주의, 경계, 심각. 임시 색 (사용자 확인 필요, Q-03).
  level_colors: [[222, 240, 222], [255, 236, 165], [255, 196, 140], [248, 150, 150]]

pass_test:
  # 통과 시험(E-27)에서 쓴 설정. 통과 시험 코드(pass_test.py)만 읽는다.
  imgsz: 640
  model_candidates:
    - yolo26n.pt
    - yolo26m.pt
    - yolo26x.pt
    - yolo11n.pt
    - yolo11m.pt
    - yolo11x.pt
  # 숫자 흔들림을 줄이는 평균 시간의 시험 후보(초). 비교해 본 값들이고 E-28에 결과가 있음.
  smoothing_seconds_candidates: [1, 2, 3, 5, 10]
