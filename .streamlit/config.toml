# Streamlit 화면 서버의 설정 (D-52, D-53, D-55). 계산에는 쓰지 않는다.
[server]
headless = true              # 켤 때 브라우저를 스스로 열지 않고, 이메일도 묻지 않는다

[browser]
gatherUsageStats = false     # 쓰는 기록을 Streamlit 쪽으로 보내지 않는다

[client]
toolbarMode = "minimal"      # 개발용 단추(Deploy 등)를 감춘다

[runner]
# 화면을 한 번 그릴 때마다 메모리 청소(gc)를 하지 않는다. 기본값(true)에서는 청소 한 번에 0.2초쯤 걸렸고,
# 화면 네 개가 1초마다 새로 그리자 서버가 CPU를 꽉 써서 화면이 멈추고 AI의 답도 늦어졌다 (E-56).
postScriptGC = false
# 단추를 누르면 그리던 것을 먼저 멈춘 뒤에 다시 그린다. 기본값(true)은 새로 그리기를 곧바로 따로 시작해서,
# 0.3초마다 도는 부분과 겹치면 화면이 통째로 비는 일이 있었다 (E-63에서 한 번 직접 봄).
fastReruns = false

[theme]
# 상황실 화면의 색과 글꼴 (D-55). 어두운 바탕에 붐빔 단계의 색이 눈에 띄게 했다.
base = "dark"
primaryColor = "#4F8CFF"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#131C31"
textColor = "#E6ECF7"
borderColor = "#22304F"
baseRadius = "0.6rem"
baseFontSize = 15
# 한글 글꼴 Pretendard (SIL OFL 1.1). 인터넷에서 불러오고, 안 되면 Windows의 맑은 고딕으로 보인다.
font = "Pretendard Variable:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, Malgun Gothic, sans-serif"
